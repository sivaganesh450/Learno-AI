services:
  - type: web
    name: lerno-backend
    runtime: python
    # Explicitly set paths
    buildCommand: cd backend && pip install -r requirements.txt
    # Use the start script
    startCommand: cd backend && chmod +x start.sh && ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        sync: false
